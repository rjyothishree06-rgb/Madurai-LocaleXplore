<!DOCTYPE html>
<html>
<head>
    <title>Delete Place</title>
</head>

<body>

<h1>Delete Tourist Place</h1>

<p>
    Are you sure you want to delete
    <strong>{{ place.name }}</strong>?
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">Yes, Delete</button>

</form>

<br>

<a href="{% url 'place_detail' place.pk %}">
    Cancel
</a>

</body>
</html>
