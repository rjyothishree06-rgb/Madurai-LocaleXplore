<!DOCTYPE html>
<html>
<head>
    <title>Place Form</title>
</head>

<body>

{% if form.instance.pk %}
    <h1>Edit Tourist Place</h1>
{% else %}
    <h1>Add Tourist Place</h1>
{% endif %}

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        {% if form.instance.pk %}
            Update Place
        {% else %}
            Add Place
        {% endif %}
    </button>

</form>

<br>

<a href="{% url 'place_list' %}">Back to Places</a>

</body>
</html>
